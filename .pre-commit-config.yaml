repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # black removed (Phase 8.5 PART 3 hotfix): ruff-format handles all
  # Python formatting and is the CI source of truth via
  # `uv run ruff format --check`. Running black after ruff caused
  # signature-wrapping conflicts on long test names (ruff did not wrap,
  # black did, CI rejected the black-wrapped version). Keep just ruff.

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
